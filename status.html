<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>HK STATUS</title>
  <style>
    :root{
      --bgA: rgba(255,255,255,.08);
      --bgB: rgba(0,0,0,.28);
      --line: rgba(255,255,255,.14);

      --white: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);

      /* cyber accents */
      --c1: rgba(140,220,255,.95); /* cyan */
      --c2: rgba(203,255,92,.95);  /* lime */
      --cGlow: rgba(140,220,255,.28);
      --cGlow2: rgba(203,255,92,.20);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--white);
    }

    /* Container sized for iframe height ~86px */
    .wrap{
      height: 86px;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .panel{
      width:100%;
      height:100%;
      border-radius: 16px;
      border: 1px solid var(--line);
      background:
        radial-gradient(420px 120px at 20% 20%, rgba(140,220,255,.18), transparent 60%),
        radial-gradient(460px 140px at 80% 70%, rgba(203,255,92,.12), transparent 65%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px 12px;
    }

    .left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }

    .label{
      font-weight: 900;
      letter-spacing: .14em;
      font-size: 12px;
      opacity:.92;
      white-space:nowrap;
    }

    .pills{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:nowrap;
      min-width: 0;
    }

    .pill{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      white-space: nowrap;
    }

    .pill .k{
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--muted);
      font-weight: 800;
    }
    .pill .v{
      font-size: 16px;
      font-weight: 1000;
      letter-spacing: .06em;
      color: var(--white);
    }

    .rankV{
      color: var(--c1);
      text-shadow: 0 0 14px var(--cGlow);
    }

    .cardsV{
      color: var(--white);
    }
    .cardsV b{
      color: var(--c2);
      text-shadow: 0 0 14px var(--cGlow2);
    }

    .right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 10px;
      min-width: 0;
    }

    .hint{
      font-size: 11px;
      color: var(--muted);
      white-space:nowrap;
    }

    /* keep compact on narrow screens */
    @media (max-width: 360px){
      .pill{ padding: 7px 10px; }
      .pill .v{ font-size: 15px; }
      .label{ display:none; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel" role="region" aria-label="学習ステータス">
      <div class="left">
        <div class="label">STATUS</div>

        <div class="pills" aria-label="ステータス値">
          <div class="pill" aria-label="ランク">
            <span class="k">RANK</span>
            <span id="rank" class="v rankV">--</span>
          </div>

          <div class="pill" aria-label="カード取得数">
            <span class="k">CARDS</span>
            <span id="cards" class="v cardsV"><b>--</b>/<span id="total">--</span></span>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="hint">（自動更新）</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const elRank  = document.getElementById("rank");
      const elCards = document.getElementById("cards");
      const elTotal = document.getElementById("total");

      const MANIFEST_URL = "./cards-manifest.json";

      function safeJsonParse(raw){
        try{ return JSON.parse(raw); }catch{ return null; }
      }

      function summarizeCounts(obj){
        let ownedTypes = 0;
        if(!obj || typeof obj !== "object") return 0;
        for(const [k,v] of Object.entries(obj)){
          const n = Number(v);
          if(!k) continue;
          if(Number.isFinite(n) && n > 0) ownedTypes++;
        }
        return ownedTypes;
      }

      function rankByRatio(owned, total){
        if(total <= 0) return "E";
        if(owned >= total) return "S"; // 100%のみ

        const r = owned / total; // 0..1
        if(r <= 0.19) return "E";
        if(r <= 0.39) return "D";
        if(r <= 0.59) return "C";
        if(r <= 0.79) return "B";
        if(r <= 0.99) return "A";
        return "A";
      }

      // --- CSV minimal loader (header row required) ---
      function splitCsvLine(line){
        const s = String(line ?? "");
        const out = [];
        let cur = "";
        let inQ = false;
        for(let i=0;i<s.length;i++){
          const ch = s[i];
          if(inQ){
            if(ch === '"'){
              if(s[i+1] === '"'){ cur += '"'; i++; }
              else inQ = false;
            }else cur += ch;
          }else{
            if(ch === ","){ out.push(cur); cur = ""; }
            else if(ch === '"'){ inQ = true; }
            else cur += ch;
          }
        }
        out.push(cur);
        return out;
      }

      async function fetchCsvRows(url){
        const res = await fetch(url, { cache:"no-store" });
        if(!res.ok) throw new Error("CSV HTTP " + res.status);
        const text = await res.text();

        const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n")
          .split("\n").filter(l => l.trim().length);

        if(!lines.length) return [];

        const header = splitCsvLine(lines[0]).map(h => String(h||"").trim());
        const rows = [];
        for(let i=1;i<lines.length;i++){
          const cols = splitCsvLine(lines[i]);
          const obj = {};
          for(let j=0;j<header.length;j++){
            obj[header[j]] = String(cols[j] ?? "").trim();
          }
          rows.push(obj);
        }
        return rows;
      }

      async function computeTotalCards(manifest){
        const sources = Array.isArray(manifest?.sources) ? manifest.sources : [];
        const urls = sources
          .map(s => String(s?.cardsCsv ?? "").trim())
          .filter(Boolean);

        let total = 0;
        for(const u of urls){
          // absolute or relative
          let csvUrl = u;
          try{ csvUrl = new URL(u, location.href).toString(); }catch{}
          const rows = await fetchCsvRows(csvUrl);
          total += rows.length; // cards.csv 1行 = 1カード前提
        }
        return total;
      }

      async function render(){
        // 1) manifest
        const mRes = await fetch(MANIFEST_URL, { cache:"no-store" });
        if(!mRes.ok) throw new Error("manifest HTTP " + mRes.status);
        const manifest = await mRes.json();

        // 2) total cards
        const total = await computeTotalCards(manifest);

        // 3) owned unique types from localStorage
        const storageKey = String(manifest?.storageKey ?? "hklobby.v1.cardCounts");
        const raw = (()=>{ try{ return localStorage.getItem(storageKey); }catch{ return null; } })();
        const countsObj = raw ? safeJsonParse(raw) : null;
        const owned = summarizeCounts(countsObj);

        const rank = rankByRatio(owned, total);

        elRank.textContent = rank;
        elTotal.textContent = String(total);
        elCards.innerHTML = `<b>${owned}</b>/${total}`;
      }

      let inflight = false;
      async function refresh(){
        if(inflight) return;
        inflight = true;
        try{ await render(); }
        catch{
          elRank.textContent = "--";
          elCards.textContent = "--/--";
          elTotal.textContent = "--";
        }finally{
          inflight = false;
        }
      }

      // boot + auto update
      refresh();
      document.addEventListener("visibilitychange", () => {
        if(document.visibilityState === "visible") refresh();
      });
      window.addEventListener("storage", () => refresh());
    })();
  </script>
</body>
</html>
